version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Mockito 5 requires Java 11; the build still runs on JDK 8
      - dependency-name: "org.mockito:*"
        versions: [">=5"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
